<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zoom Transcript Downloader</title>
    <style>
      body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; margin: 12px; min-width: 340px; }
      label { display: block; margin: 8px 0; }
      input[type="text"] { width: 100%; box-sizing: border-box; }
      button { margin-top: 8px; }
      .hint { color: #555; font-size: 12px; }
    </style>
  </head>
  <body>
    <strong>Zoom Transcript Downloader</strong>
    <label>
      Filename pattern
      <input id="pattern" type="text" value="{date} - {time} - {title}" />
    </label>
    <label>
      Helper URL
      <input id="helperBaseUrl" type="text" value="http://127.0.0.1:47321" />
    </label>
    <label>
      Save root / path hint
      <input id="savePath" type="text" value="/Users/macmini/Downloads/Meeting Notes" />
    </label>
    <label>
      <input id="dryRun" type="checkbox" checked /> Dry run
    </label>
    <div class="hint">The actual save path is controlled by the local helper. This field is a visible setting/hint and can be copied into the helper launch command.</div>
    <button id="save">Save</button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
